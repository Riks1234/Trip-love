<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Question ❤️</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ffe1eb, #fff7f9);
}

.card {
  width: min(90%, 520px);
  padding: 45px 25px;
  text-align: center;
  background: rgba(255,255,255,.94);
  border-radius: 30px;
  box-shadow: 0 15px 50px rgba(180,70,100,.2);
}

.heart {
  font-size: 65px;
  animation: pulse 1.2s infinite;
}

h1 {
  margin: 10px 0;
  color: #d6336c;
  font-size: clamp(30px, 8vw, 48px);
}

p {
  color: #777;
  font-size: 18px;
  margin: 10px 0 30px;
}

.buttons {
  position: relative;
  height: 70px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 22px;
}

button {
  border: none;
  border-radius: 50px;
  padding: 15px 32px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

#yesBtn {
  background: #ff4d7d;
  color: white;
  box-shadow: 0 8px 20px rgba(255,77,125,.3);
  position: relative;
  z-index: 2;
}

#noBtn {
  background: #eeeeee;
  color: #555;
  z-index: 3;
}

.success {
  display: none;
}

.success h1 {
  font-size: clamp(32px, 9vw, 52px);
}

.success p {
  font-size: 23px;
  color: #d6336c;
  font-weight: bold;
}

@keyframes pulse {
  50% { transform: scale(1.12); }
}
</style>
</head>

<body>

<div class="card" id="questionCard">
  <div class="heart">❤️</div>
  <h1>Want to go for a trip?</h1>
  <p>Choose wisely... 😏</p>

  <div class="buttons">
    <button id="yesBtn">Yes 😍</button>
    <button id="noBtn">No 🙈</button>
  </div>
</div>

<div class="card success" id="successCard">
  <div class="heart">❤️</div>
  <h1>Congratulations!! 🎉</h1>
  <p>YEAH YOU CLICKED ON NO 😏😂</p>
  <p>I LOVE YOU ❤️🥰</p>
</div>

<script>
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const questionCard = document.getElementById("questionCard");
const successCard = document.getElementById("successCard");

// YES is deliberately NOT clickable.
// It runs away whenever the person tries to approach it.
function moveYes() {
  yesBtn.style.position = "fixed";

  const margin = 20;
  const maxX = window.innerWidth - yesBtn.offsetWidth - margin;
  const maxY = window.innerHeight - yesBtn.offsetHeight - margin;

  const x = margin + Math.random() * Math.max(0, maxX - margin);
  const y = margin + Math.random() * Math.max(0, maxY - margin);

  yesBtn.style.left = x + "px";
  yesBtn.style.top = y + "px";
}

// Desktop
yesBtn.addEventListener("mouseenter", moveYes);

// Mobile
yesBtn.addEventListener("touchstart", function(e) {
  e.preventDefault();
  moveYes();
}, { passive: false });

// Extra protection: if they somehow try clicking YES, move it again.
yesBtn.addEventListener("click", function(e) {
  e.preventDefault();
  moveYes();
});

// NO is the actual answer button.
noBtn.addEventListener("click", function() {
  questionCard.style.display = "none";
  successCard.style.display = "block";
});
</script>

</body>
</html>
